<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ma-bo- | Blog & Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="header-inner">
      <h1 class="site-title">Ma-bo-</h1>
      <nav>
        <a href="#about">About</a>
        <a href="#portfolio">Portfolio</a>
        <a href="#blog">Blog</a>
      </nav>
    </div>
  </header>

  <section id="about" class="hero">
    <h2>こんにちは、Ma-bo-です</h2>
    <p>作ったものを記録し、学んだことを共有するサイトです。</p>
  </section>

  <section id="portfolio" class="section">
    <h2 class="section-title">Portfolio</h2>
    <div class="card-grid">
      <div class="card">
        <h3>作品タイトル</h3>
        <p>作品の説明をここに書きます。</p>
      </div>
    </div>
  </section>

  <section id="blog" class="section alt">
    <h2 class="section-title">Blog / Tips</h2>
    <div class="card-grid">
      <div class="card">
        <h3>記事タイトル</h3>
        <p>記事の概要をここに書きます。</p>
      </div>
    </div>
  </section>

  <footer>
    <p>&copy; 2026 Ma-bo-</p>
  </footer>

</body>
</html>
