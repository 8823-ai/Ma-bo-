<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | Ma-bo-</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="header-inner">
      <h1 class="site-title"><a href="index.html">Ma-bo-</a></h1>
      <nav>
        <a href="index.html#about">About</a>
        <a href="index.html#portfolio">Portfolio</a>
        <a href="gallery.html" class="active">Gallery</a>
      </nav>
    </div>
  </header>

  <div class="page-hero">
    <h2>Gallery</h2>
    <p>生成した画像とひとこと日記</p>
  </div>

  <main class="feed">

    <!--
      =============================================
      投稿テンプレート（新しい投稿はここをコピーして
      一番上に貼り付け、画像パスと文章を書き換える）
      =============================================

    <article class="post">
      <div class="post-meta">
        <time>2026-00-00</time>
      </div>
      <img src="images/ファイル名.png" alt="説明" class="post-img">
      <p class="post-text">ここに日記を書く。</p>
    </article>

      =============================================
    -->

    <!-- サンプル投稿（実際の画像に差し替えてください） -->
    <article class="post">
      <div class="post-meta">
        <time>2026-05-22</time>
      </div>
      <div class="post-img-placeholder">
        <span>最初の作品をここに置こう<br>images/ フォルダに画像を入れてね</span>
      </div>
      <p class="post-text">サイトを立ち上げた日。ここに感想や使ったプロンプトのメモなど何でも書いていい。</p>
    </article>

  </main>

  <footer>
    <p>&copy; 2026 Ma-bo-</p>
  </footer>

</body>
</html>
